---
# threat-feed-secrets — referenced by all three deployments and the key rotation CronJob.
#
# DO NOT store real values here. This file contains only the structure.
# In production, populate via:
#   kubectl create secret generic threat-feed-secrets \
#     --from-literal=THREAT_FEED_API_KEY=<value> \
#     --from-literal=REDIS_PASSWORD=<value> \
#     -n intel-ingestion
#
# Or use Sealed Secrets / External Secrets Operator to sync from a vault.
apiVersion: v1
kind: Secret
metadata:
  name: threat-feed-secrets
  namespace: intel-ingestion
type: Opaque
# Values must be base64-encoded. The placeholders below are empty strings.
# Replace before applying to a real cluster.
data:
  THREAT_FEED_API_KEY: ""   # base64(your-api-key)
  REDIS_PASSWORD: ""        # base64(your-redis-password)
