# ServiceMonitor for Prometheus Operator — covers all three pipeline services
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: intel-worker-metrics
  namespace: intel-ingestion
  labels:
    release: prometheus
spec:
  selector:
    matchExpressions:
    - key: app
      operator: In
      values:
      - intel-worker
      - intel-fetcher
      - intel-processor
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
    scheme: http
  namespaceSelector:
    matchNames:
    - intel-ingestion
